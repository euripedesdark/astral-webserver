[package]
name = "astral-webserver"
version = "1.0.0"
edition = "2021"
authors = ["Euripedes Batista de Paiva Junior <euripedes@srvcloud.cloud>"]
description = "Astral Web Server: Unified Web Infrastructure Administration for Nginx and Apache Tomcat in Rust & React"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
sysinfo = "0.30"
tempfile = "3.10"
regex = "1.10"
futures-util = "0.3"

[[bin]]
name = "astral-webserver"
path = "src/main.rs"
